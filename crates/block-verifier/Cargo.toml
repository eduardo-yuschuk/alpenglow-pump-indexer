[package]
name = "block-verifier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-postgres = "0.7.18"
